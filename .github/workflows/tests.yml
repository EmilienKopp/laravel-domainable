name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcov only on the 8.4 job, which is the one that renders the badge
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint (Pint)
        if: matrix.php == '8.4'
        run: composer lint -- --test

      - name: Static analysis (PHPStan)
        if: matrix.php == '8.4'
        run: composer type

      - name: Tests (Pest)
        run: composer test

      # --- Coverage badge (8.4 only, and only when pushing to main) ---
      - name: Coverage report (clover)
        if: matrix.php == '8.4' && github.event_name == 'push'
        run: vendor/bin/pest --coverage-clover=coverage.xml --exclude-group=benchmark

      - name: Render coverage badge
        if: matrix.php == '8.4' && github.event_name == 'push'
        uses: timkrase/phpunit-coverage-badge@v1.2.1
        with:
          report: coverage.xml
          coverage_badge_path: .github/badges/coverage.svg
          push_badge: false

      - name: Commit updated badge
        if: matrix.php == '8.4' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update coverage badge [skip ci]'
          file_pattern: .github/badges/coverage.svg
